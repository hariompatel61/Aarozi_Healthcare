services:
  # PostgreSQL 16 Relational Database
  db:
    image: postgres:16-alpine
    container_name: aarozi-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aarozi_health}
      POSTGRES_USER: ${POSTGRES_USER:-aarozi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - aarozi-net

  # Redis 7 Cache & Task Queue
  redis:
    image: redis:7-alpine
    container_name: aarozi-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - aarozi-net

  # FastAPI Clinical Backend Service
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: aarozi-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-aarozi_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-aarozi_health}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Application secret key required}
      VENDOR_KEY_ID: aarozi-root-key-2026
    volumes:
      - reports_storage:/app/storage/reports
      - audit_logs:/app/storage/logs
    deploy:
      resources:
        limits:
          memory: 1.5G
    networks:
      - aarozi-net

  # Nuxt 3 Clinical Frontend Web Application
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NUXT_PUBLIC_API_BASE: /api
    container_name: aarozi-web
    restart: always
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NITRO_PORT: 3000
      NITRO_HOST: 0.0.0.0
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - aarozi-net

  # Caddy Reverse Proxy & Automated SSL
  caddy:
    image: caddy:2-alpine
    container_name: aarozi-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/logs/caddy:/var/log/caddy
    depends_on:
      - api
      - web
    networks:
      - aarozi-net

volumes:
  pgdata:
  redisdata:
  reports_storage:
  audit_logs:
  caddy_data:
  caddy_config:

networks:
  aarozi-net:
    driver: bridge

