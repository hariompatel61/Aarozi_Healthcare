project: Aarozi Healthcare
entities:
  tenant: One customer organization using the platform.
  branch: Operational location belonging to a tenant.
  department: Functional unit such as Hematology or Blood Bank.
  user: Authenticated staff identity.
  role: Named permission bundle.
  permission: Atomic module/resource/action capability.
  patient: Single shared patient identity across all clinical and billing workflows.
  order: Request for one or more laboratory services.
  order_item: A service within an order.
  test: Structured analyte/test definition used by billing, sample and results.
  profile: Group of tests/analytes for ordering and reporting.
  package: Commercial bundle of tests with pricing rules.
  sample: Physical specimen linked to an order item.
  result: Result record attached to an order item/sample.
  report: Released patient-facing document generated from result data.
  report_version: Immutable or controlled version of a report.
  invoice: Financial document for ordered services.
  payment: Money movement against an invoice.
  referral_partner: Doctor, hospital, external lab, collection centre or corporate account.
  referral_rule: Time-scoped discount/commission logic.
  commission_ledger: Calculated referral entitlement and settlement history.
  donor: Person providing a blood donation.
  donation: A donation event linked to donor screening.
  blood_unit: Traceable physical blood unit/component inventory item.
  cross_match: Compatibility workflow between patient sample and blood unit(s).
  analyzer: Instrument connected through a local connector.
  analyzer_message: Raw/parsed machine message.
  report_template: Versioned layout/configuration for report rendering.
  installation: A registered local server/site installation bound to an organization.
  license: Signed deployment entitlement with mode, limits, modules and expiry.
  activation_request: File-based request generated by a never-online installation.
  renewal_request: File-based request for extending/replacing an offline license.
  device: Installed client or connector identity used for licensing/sync.
  sync_event: Durable change queued for local/cloud synchronization.
  sync_checkpoint: Last acknowledged sync sequence for a stream/device.
  backup: Encrypted recoverable local/cloud backup artifact.

