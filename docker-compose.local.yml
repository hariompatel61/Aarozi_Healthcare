version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEPLOYMENT_MODE: offline_local
      DATABASE_URL: postgresql+asyncpg://aarozi:aarozi@postgres:5432/aarozi_healthcare
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: aarozi-local
      MINIO_ROOT_USER: aarozi
      MINIO_ROOT_PASSWORD: aarozi-local-secure-password
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/api

  analyzer-connector:
    build:
      context: ./services/analyzer-connector
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3001
      API_URL: http://api:8000
    ports:
      - "3001:3001"
    depends_on:
      - api

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aarozi
      POSTGRES_PASSWORD: aarozi
      POSTGRES_DB: aarozi_healthcare
    ports: ["5432:5432"]
    volumes: ["aarozi_local_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aarozi -d aarozi_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["aarozi_local_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aarozi
      MINIO_ROOT_PASSWORD: aarozi-local-secure-password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["aarozi_local_minio:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  aarozi_local_pg:
  aarozi_local_redis:
  aarozi_local_minio:
