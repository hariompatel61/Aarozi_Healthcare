# Root pyproject.toml — Python workspace configuration for Aarozi Healthcare.
#
# This file makes the repo root the Python workspace root.
# `contracts/` is a first-class importable package from here.
# `apps/api` contains the FastAPI application and is installed in editable
# mode during development so that `from app.main import app` resolves
# regardless of the working directory.
#
# Install for development:
#   pip install -e ./apps/api -e .
# Or with uv:
#   uv pip install -e ./apps/api -e .

[project]
name = "aarozi-healthcare-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apps/api", "contracts", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S101",    # use of assert (allowed in tests)
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "apps/api:."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*"]
