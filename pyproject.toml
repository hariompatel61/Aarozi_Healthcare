# Root pyproject.toml — Python workspace configuration for Aarozi Healthcare.
#
# This file makes the repo root the Python workspace root.
# `contracts/` is a first-class importable package from here.
# `apps/api` contains the FastAPI application and is installed in editable
# mode during development so that `from app.main import app` resolves
# regardless of the working directory.
#
# Install for development:
#   pip install -e ./apps/api -e .
# Or with uv:
#   uv pip install -e ./apps/api -e .

[project]
name = "aarozi-healthcare-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["apps/api", "contracts", "tools"]
exclude = [
    "apps/api/alembic",
    "apps/api/tests",
    ".git",
    ".output",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long
    "F401",  # unused imports
    "E741",  # ambiguous variable name
    "E402",  # module level import not at top of file
    "E701",  # multiple statements on one line
    "E712",  # comparison to True/False
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"apps/api/tests/**" = ["F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
ignore_errors = true
explicit_package_bases = true
mypy_path = "apps/api:."

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["contracts*"]
