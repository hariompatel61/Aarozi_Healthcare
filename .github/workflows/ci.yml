name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./apps/api -e .
          pip install pytest ruff mypy greenlet

      - name: Run Ruff Lint
        run: ruff check apps/api contracts tools

      - name: Run Mypy Typecheck
        run: mypy apps/api/app contracts

      - name: Seed demo database
        run: python scripts/seed_demo_data.py

      - name: Run Pytest
        run: PYTHONPATH=. python -m pytest apps/api/tests -q